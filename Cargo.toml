[package]
name = "nautilus-txflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "LGPL-3.0-only"
description = "TxFlow perpetuals exchange adapter for NautilusTrader"
publish = false

[lib]
name = "nautilus_txflow"

[features]
default = ["high-precision"]
high-precision = ["nautilus-model/high-precision"]
examples = ["nautilus-live/node"]
# Python bindings (config, enums, factories), named as in nautilus-risex.
python = [
    "dep:nautilus-system",
    "dep:pyo3",
    "dep:pyo3-async-runtimes",
    "nautilus-common/python",
    "nautilus-core/python",
    "nautilus-live/python",
    "nautilus-model/python",
    "nautilus-network/python",
    "nautilus-system/python",
]
extension-module = [
    "python",
    "nautilus-common/extension-module",
    "nautilus-core/extension-module",
    "nautilus-live/extension-module",
    "nautilus-model/extension-module",
    "nautilus-network/extension-module",
    "pyo3/extension-module",
]

# nautilus-* crates are pinned to one exact version: a mixed set does not link.
[dependencies]
nautilus-common = { version = "=0.67.0", features = ["live"] }
nautilus-core = "=0.67.0"
nautilus-execution = "=0.67.0"
nautilus-live = { version = "=0.67.0", default-features = false }
nautilus-model = "=0.67.0"
nautilus-network = { version = "=0.67.0", default-features = false, features = ["transport-sockudo"] }
nautilus-system = { version = "=0.67.0", optional = true }

ahash = { version = "0.8.12", features = ["serde"] }
alloy = { version = "2.5.0", default-features = false, features = ["sol-types", "signer-local"] }
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std", "serde"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
dashmap = "6.2.1"
log = "0.4.34"
parking_lot = "0.13.0"
pyo3 = { version = "0.30.1", default-features = false, features = ["macros", "multiple-pymethods"], optional = true }
pyo3-async-runtimes = { version = "0.30.0", default-features = false, features = ["tokio-runtime"], optional = true }
# Same MessagePack encoder as nautilus-hyperliquid: the action hash depends on its bytes.
rmp-serde = "1.3.1"
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["parking_lot", "rt-multi-thread", "sync", "fs", "io-util", "net", "time", "macros", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.20"
zeroize = "1.9.1"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query", "ws"] }
dotenvy = "0.15.7"
nautilus-live = { version = "=0.67.0", default-features = false, features = ["test-support"] }
rstest = "0.28.0"
rust_decimal_macros = "1.40.0"
nautilus-testkit = { version = "=0.67.0", default-features = false, features = ["testers"] }

[[example]]
name = "data_tester"
path = "examples/data_tester.rs"
doc = false
required-features = ["examples"]

[[example]]
name = "exec_tester"
path = "examples/exec_tester.rs"
doc = false
required-features = ["examples"]
