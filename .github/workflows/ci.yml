name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy --all-targets --features examples -- -D warnings
      - run: cargo test --features examples
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # `+nightly`: rust-toolchain.toml pins the stable toolchain for this directory
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Run each fuzz target for 30 seconds
        run: |
          for target in fuzz/fuzz_targets/*.rs; do
            cargo +nightly fuzz run "$(basename "$target" .rs)" -- -max_total_time=30
          done
